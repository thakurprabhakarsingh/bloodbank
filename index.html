<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation & Emergency Plasma Network</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px 0;
        }

        header {
            background: #000000;
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-radius: 12px;
            max-width: 800px;
            margin: 0 auto 25px auto;
            border-bottom: 6px solid #ff0000;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
        }

        header h1 {
            color: #cf0505;
            font-size: 28px;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        header p {
            color: #ffffff !important;
            font-size: 15px;
            opacity: 0.95;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .card {
            background: #ffffff;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #1f2937;
            font-size: 20px;
            margin-bottom: 18px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 10px;
            font-weight: 600;
        }

        input, select {
            padding: 13px 15px;
            font-size: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            outline: none;
            background-color: #f8fafc;
            width: 100%;
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .list-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }

        .item-card h3 {
            margin-bottom: 8px;
            color: #111827;
            font-size: 18px;
        }

        .item-card p {
            margin: 5px 0;
            color: #4b5563;
            font-size: 14px;
        }

        .contact-buttons {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .btn-call {
            flex: 1;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 11px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-whatsapp {
            flex: 1;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            padding: 11px;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        #donorForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        #donorForm button[type="submit"] {
            grid-column: span 2;
            padding: 14px;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 75, 43, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff416c, #ff4b2b) !important;
            width: 100%;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🩸 Blood & Plasma Network</h1>
        <p>Connecting urgent needs with life-saving donors</p>
    </header>

    <main class="container">
        <section class="card">
            <h2>✨ Register as a Donor</h2>
            <form id="donorForm">
                <div class="form-group">
                    <label>👤 Full Name</label>
                    <input type="text" id="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label>📍 City / Area</label>
                    <input type="text" id="city" placeholder="Enter your city" required>
                </div>

                <div class="form-group">
                    <label>🩸 Blood Group</label>
                    <select id="bloodGroup" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>💊 Medical History</label>
                    <select id="medicalCondition" required onchange="this.nextElementSibling.style.display = this.value === 'Other' ? 'block' : 'none';">
                        <option value="">Any medical condition?</option>
                        <option value="No">Nahi (No)</option>
                        <option value="Diabetes">Diabetes (Sugar)</option>
                        <option value="BP">Blood Pressure (BP)</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="otherMedicalInput" placeholder="Type condition..." style="display: none; margin-top: 5px;">
                </div>

                <div class="form-group">
                    <label>📞 Contact Number</label>
                    <input type="text" id="phone" placeholder="10-digit mobile" maxlength="10" required>
                </div>

                <div class="form-group">
                    <label>🆔 ID Proof Number</label>
                    <input type="text" id="idProof" placeholder="Voter ID / License No." required>
                </div>

                <button type="submit">Register Now</button>
            </form>
        </section>

        <section class="card">
            <h2>Find Donors</h2>
            <div class="filters">
                <select id="filterBlood">
                    <option value="">Filter by Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
                <input type="text" id="filterCity" placeholder="Filter by City...">
            </div>
            <div id="donorList" class="list-grid"></div>
        </section>

        <section class="card">
            <h2>🚨 Emergency Broadcast Board</h2>
            <form id="emergencyForm">
                <input type="text" id="patientName" placeholder="Patient Name & Hospital" required style="margin-bottom: 10px; width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;">
                <select id="reqBloodGroup" required style="margin-bottom: 10px; width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;">
                    <option value="">Required Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
                <input type="text" id="emergencyPhone" placeholder="Emergency Contact Number" maxlength="10" required style="margin-bottom: 10px; width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px;">
                <button type="submit" class="btn-danger">Broadcast Request</button>
            </form>
            <div id="emergencyList" class="list-grid" style="margin-top: 15px;"></div>
        </section>
    </main>

    <script>
        // Yahan apna naya Google Apps Script Web App URL dalein
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwbpqzxXAzN-xifYiR8iqplec3bFaAkHeVbXxkFxAidg58HQaYYYUIk_cBg88CmXXxD/exec";

        document.addEventListener("DOMContentLoaded", () => {
            loadDonors();
            loadEmergencies();

            // Donor Registration Form Submit
            document.getElementById("donorForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                
                const medicalSelect = document.getElementById("medicalCondition").value;
                const otherInput = document.getElementById("otherMedicalInput").value.trim();
                let finalMedical = medicalSelect === 'Other' ? otherInput : medicalSelect;

                const donorData = {
                    name: document.getElementById("name").value.trim(),
                    city: document.getElementById("city").value.trim().toLowerCase(),
                    bloodGroup: document.getElementById("bloodGroup").value,
                    medicalCondition: finalMedical,
                    idProof: document.getElementById("idProof").value.trim(),
                    phone: document.getElementById("phone").value.trim()
                };

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(donorData)
                    });

                    if (response.ok) {
                        document.getElementById("donorForm").reset();
                        document.getElementById("otherMedicalInput").style.display = "none";
                        loadDonors();
                        alert("Data successfully save ho gaya Google Sheet mein!");
                    }
                } catch (err) {
                    console.error("Error:", err);
                    alert("Error saving data.");
                }
            });

            // Emergency Form Submit
            document.getElementById("emergencyForm").addEventListener("submit", (e) => {
                e.preventDefault();
                const emergency = {
                    id: Date.now(),
                    patientName: document.getElementById("patientName").value.trim(),
                    reqBloodGroup: document.getElementById("reqBloodGroup").value,
                    phone: document.getElementById("emergencyPhone").value.trim()
                };

                let emergencies = JSON.parse(localStorage.getItem("emergencies")) || [];
                emergencies.unshift(emergency);
                localStorage.setItem("emergencies", JSON.stringify(emergencies));

                document.getElementById("emergencyForm").reset();
                loadEmergencies();
                loadDonors(); 
                alert("Emergency broadcast posted!");
            });

            document.getElementById("filterBlood").addEventListener("change", loadDonors);
            document.getElementById("filterCity").addEventListener("input", loadDonors);
        });

        // Load Donors from Google Sheet
        async function loadDonors() {
            const donorList = document.getElementById("donorList");
            const filterBlood = document.getElementById("filterBlood").value;
            const filterCity = document.getElementById("filterCity").value.toLowerCase().trim();

            donorList.innerHTML = "<p>Loading donors from database...</p>";

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const donors = await response.json();
                let emergencies = JSON.parse(localStorage.getItem("emergencies")) || [];

                let filtered = donors.filter(donor => {
                    let matchBlood = filterBlood === "" || donor.bloodGroup === filterBlood;
                    let matchCity = filterCity === "" || (donor.city && donor.city.toLowerCase().includes(filterCity));
                    return matchBlood && matchCity;
                });

                if (filtered.length === 0) {
                    donorList.innerHTML = "<p>No donors found.</p>";
                    return;
                }

                donorList.innerHTML = filtered.map(d => {
                    let medicalText = d.medicalCondition ? d.medicalCondition : "Nahi (No)";

                    return `
                        <div class="item-card">
                            <h3>${d.name || 'Unknown'} (${d.bloodGroup || 'N/A'})</h3>
                            <p>📍 Location: ${d.city ? d.city.toUpperCase() : 'N/A'}</p>
                            <p>💊 Medical Info: ${medicalText}</p>
                            <p>🆔 ID Proof: ${d.idProof || 'N/A'}</p>
                            
                            <div class="contact-buttons">
                                <a href="tel:${d.phone}" class="btn-call">📞 Call</a>
                                <a href="https://wa.me/91${d.phone}?text=Hello%20${d.name},%20emergency%20hai%20kya%20aap%20blood%20donate%20kar%20sakte%20hain?" target="_blank" class="btn-whatsapp">💬 WhatsApp</a>
                            </div>
                        </div>
                    `;
                }).join("");
            } catch (err) {
                console.error("Error loading donors:", err);
                donorList.innerHTML = "<p>Error loading data from Google Sheet.</p>";
            }
        }

        // Load Emergency Broadcasts
        function loadEmergencies() {
            const emergencyList = document.getElementById("emergencyList");
            let emergencies = JSON.parse(localStorage.getItem("emergencies")) || [];

            if (emergencies.length === 0) {
                emergencyList.innerHTML = "<p>No active emergency requests.</p>";
                return;
            }

            emergencyList.innerHTML = emergencies.map(e => {
                let bloodGrp = e.reqBloodGroup || e.bloodGroup;
                let shareText = `🚨 EMERGENCY BLOOD REQUEST 🚨%0A🏥 Patient/Hospital: ${e.patientName}%0A🩸 Blood Group: ${bloodGrp}%0A📞 Contact: ${e.phone}%0AKripya madad karein!`;

                return `
                    <div class="item-card" style="border-left: 4px solid #d9534f; background-color: #fff8f8;">
                        <h3>🚨 Urgent Need for ${bloodGrp} Blood</h3>
                        <p>🏥 Patient/Hospital: ${e.patientName}</p>
                        <p>📞 Contact: ${e.phone}</p>
                        
                        <div class="contact-buttons" style="margin-top: 10px; display: flex; gap: 8px;">
                            <a href="tel:${e.phone}" class="btn-call" style="background-color: #d9534f;">📞 Call</a>
                            <a href="https://wa.me/?text=${shareText}" target="_blank" class="btn-whatsapp">📤 Share to WhatsApp</a>
                        </div>
                    </div>
                `;
            }).join("");
        }
    </script>
</body>
</html>
